openapi: 3.0.0
info:
  title: Multi-Tenant SaaS API
  version: 1.0.0
  description: Production-grade Multi-Tenant SaaS API with row-level security

servers:
  - url: http://localhost:8080/api/v1
    description: Local development server

paths:
  /health:
    get:
      summary: Health check
      tags:
        - Health
      responses:
        '200':
          description: Service is healthy
          content:
            application/json:
              schema:
                type: object
                properties:
                  status:
                    type: string
                  service:
                    type: string

  /auth/register:
    post:
      summary: Register a new user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
                - name
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
                  minLength: 8
                name:
                  type: string
      responses:
        '200':
          description: User created successfully
        '400':
          description: Invalid request

  /auth/login:
    post:
      summary: Login user
      tags:
        - Auth
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - email
                - password
              properties:
                email:
                  type: string
                  format: email
                password:
                  type: string
      responses:
        '200':
          description: Login successful
        '401':
          description: Invalid credentials

  /auth/me:
    get:
      summary: Get current user
      tags:
        - Auth
      security:
        - cookieAuth: []
      responses:
        '200':
          description: Current user information
        '401':
          description: Unauthorized

  /workspaces:
    get:
      summary: List workspaces
      tags:
        - Workspaces
      security:
        - cookieAuth: []
      responses:
        '200':
          description: List of workspaces
    post:
      summary: Create workspace
      tags:
        - Workspaces
      security:
        - cookieAuth: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
      responses:
        '201':
          description: Workspace created

  /workspaces/{id}:
    get:
      summary: Get workspace
      tags:
        - Workspaces
      security:
        - cookieAuth: []
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Workspace details

  /projects:
    get:
      summary: List projects
      tags:
        - Projects
      security:
        - cookieAuth: []
      parameters:
        - name: X-Workspace-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of projects
    post:
      summary: Create project
      tags:
        - Projects
      security:
        - cookieAuth: []
      parameters:
        - name: X-Workspace-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - name
              properties:
                name:
                  type: string
                description:
                  type: string
      responses:
        '201':
          description: Project created

  /projects/{id}:
    get:
      summary: Get project
      tags:
        - Projects
      security:
        - cookieAuth: []
      parameters:
        - name: X-Workspace-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: id
          in: path
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: Project details

  /tasks:
    get:
      summary: List tasks
      tags:
        - Tasks
      security:
        - cookieAuth: []
      parameters:
        - name: X-Workspace-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
        - name: project_id
          in: query
          required: true
          schema:
            type: string
            format: uuid
      responses:
        '200':
          description: List of tasks
    post:
      summary: Create task
      tags:
        - Tasks
      security:
        - cookieAuth: []
      parameters:
        - name: X-Workspace-ID
          in: header
          required: true
          schema:
            type: string
            format: uuid
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
                - project_id
                - title
              properties:
                project_id:
                  type: string
                  format: uuid
                title:
                  type: string
                description:
                  type: string
                status:
                  type: string
                  enum: [todo, in_progress, done]
      responses:
        '201':
          description: Task created

securitySchemes:
  cookieAuth:
    type: apiKey
    in: cookie
    name: session
